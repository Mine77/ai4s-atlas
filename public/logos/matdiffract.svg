<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 蓝色渐变 -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F65D1"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>

    <!-- 波形渐变（从浅到深） -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- 波形光晕 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 图标部分 -->
  <g transform="translate(0, 0)">
    <!-- 六边形晶胞结构 -->
    <path d="M32 2 L58 11 L58 53 L32 62 L6 53 L6 11 Z"
          fill="rgba(47, 101, 209, 0.08)"
          stroke="url(#blueGradient)"
          stroke-width="3.2"
          stroke-linejoin="round"/>

    <!-- 两个靠近且一致的衍射峰波形 -->
    <path d="M12 48.0
L12.5 48.0
L13 48.0
L13.5 47.8
L14 48.0
L14.5 47.8
L15 47.5
L16 46.5
L17 43.0
L18 36.0
L19 26.0
L20 19.0
L21 16.5
L21.5 16.0
L22 16.5
L23 19.0
L24 26.0
L25 36.0
L26 43.0
L27 46.5
L28 47.5
L29 48.0
L30 48.1
L31 48.0
L32.5 48.0
L33 47.8
L33.5 47.5
L35 46.5
L36 43.0
L37 36.0
L38 26.0
L39 19.0
L40 16.5
L40.5 16.0
L41 16.5
L42 19.0
L43 26.0
L44 36.0
L45 43.0
L46 46.5
L47 47.5
L48 48.0
L49 48.1
L50 48.0
L51 48.0"
          fill="none"
          stroke="url(#waveGradient)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- 峰值标记线（突出两个峰） -->
    <line x1="23" y1="16" x2="23" y2="48" stroke="url(#waveGradient)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2,2"/>
    <line x1="42" y1="16" x2="42" y2="48" stroke="url(#waveGradient)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2,2"/>
  </g>
</svg>
